name: Deploy HF Space
# Mirrors space/ (+ the nes2net package) to a Hugging Face Gradio Space on ZeroGPU.
# Setup once: repo Settings > Secrets and variables > Actions
#   - secret   HF_TOKEN  : Hugging Face token with *write* access
#   - variable HF_SPACE  : (optional) <user>/<space>, default below
on:
  push:
    branches: [main]
    paths: ['space/**', 'nes2net/**', '.github/workflows/deploy_space.yml']
  workflow_dispatch:
concurrency: {group: deploy-space, cancel-in-progress: true}
env:
  HF_SPACE: ${{ vars.HF_SPACE || 'trinhphamtrunghieu/nes2net-fake-voice-detection' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check HF_TOKEN secret
        env: {HF_TOKEN: '${{ secrets.HF_TOKEN }}'}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing repo secret HF_TOKEN (Settings > Secrets and variables > Actions). Use a Hugging Face token with write access."
            exit 1
          fi
      - run: pip install -q -U huggingface_hub
      - name: Bundle package + compile check
        run: |
          bash space/sync.sh
          python -m py_compile space/app.py space/nes2net/*.py
      - name: Create / update Space
        env: {HF_TOKEN: '${{ secrets.HF_TOKEN }}'}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          rid = os.environ['HF_SPACE']
          # ZeroGPU ("zero-a10g") hardware; hardware in README YAML is ignored by the Hub
          api.create_repo(rid, repo_type='space', space_sdk='gradio', space_hardware='zero-a10g',
                          exist_ok=True)
          # slow boot (1.3 GB checkpoint): disable SSR health check, per HF Spaces guidance
          api.add_space_variable(rid, 'GRADIO_SSR_MODE', 'false')
          api.upload_folder(repo_id=rid, repo_type='space', folder_path='space',
                            ignore_patterns=['sync.sh', '**/__pycache__/**', '__pycache__/**'],
                            delete_patterns=['nes2net/*.py'],
                            commit_message=f"deploy {os.environ.get('GITHUB_SHA', '')[:7]}")
          rt = api.get_space_runtime(rid)
          if rt.requested_hardware != 'zero-a10g' and rt.hardware != 'zero-a10g':
              api.request_space_hardware(rid, 'zero-a10g')
              rt = api.get_space_runtime(rid)
          print(f'https://huggingface.co/spaces/{rid}  stage={rt.stage} hardware={rt.hardware}')
          PY
